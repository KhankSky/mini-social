version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-local
    restart: always
    user: root # Chạy root để dùng được docker socket
    ports:
      - "8081:8080" # Truy cập Jenkins qua localhost:8081
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Mount docker socket
      # Nếu dùng Windows, đường dẫn socket có thể là //var/run/docker.sock
      # Hoặc cài đặt Docker Desktop và bật "Expose daemon on tcp://localhost:2375"
volumes:
  jenkins_home: