version: '3.8'

services:
  social-be:
    image: ${DOCKER_IMAGE_NAME}
    container_name: social-be
    restart: always
    network_mode: "host"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/social
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
